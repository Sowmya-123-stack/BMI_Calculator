<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <style>
    body {
      font-family: Arial;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }
    input, button {
      margin: 10px 0;
      padding: 8px;
      width: 100%;
    }
    img {
      max-width: 100%;
      display: block;
      margin: 10px auto;
    }
    canvas {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h2>BMI Calculator</h2>

  <form id="bmiForm">
    <input type="number" id="weight" placeholder="Weight in kg" required>
    <input type="number" id="height" placeholder="Height in cm" required>
    <button type="button" onclick="calculateBMI()">Calculate</button>
    <button type="button" onclick="resetForm()">Reset</button>
    <button type="button" onclick="downloadPDF()">Download PDF</button>
  </form>

  <div id="result"></div>
  <img id="bmiImage" src="" alt="BMI Category Image">
  <canvas id="bmiChart" width="400" height="200"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- AdMob integration (Cordova) -->
  <script type="text/javascript">
    function initializeAdMob() {
      if (window.admob) {
        // Banner Ad
        window.admob.banner.config({
          id: 'your-admob-banner-id', // Replace with your AdMob Banner Ad ID
          isTesting: true, // Set to true for testing ads
          autoShow: true
        });

        window.admob.banner.prepare().then(() => {
          console.log('Banner ad loaded');
        }).catch((error) => {
          console.error('Error loading banner ad', error);
        });
      }
    }

    // Call this function after Cordova is ready
    document.addEventListener('deviceready', initializeAdMob, false);
  </script>

  <script>
    let chart;

    function calculateBMI() {
      const weight = parseFloat(document.getElementById("weight").value);
      const heightCm = parseFloat(document.getElementById("height").value);
      const heightM = heightCm / 100;
      const bmi = weight / (heightM * heightM);
      let category = "";

      if (bmi < 18.5) category = "Underweight";
      else if (bmi < 25) category = "Normal weight";
      else if (bmi < 30) category = "Overweight";
      else category = "Obese";

      document.getElementById("result").innerText = `Your BMI is ${bmi.toFixed(2)} (${category})`;

      // Image change
      const img = document.getElementById("bmiImage");
      if (category === "Underweight") img.src = "https://via.placeholder.com/300x200?text=Underweight";
      else if (category === "Normal weight") img.src = "https://via.placeholder.com/300x200?text=Normal";
      else if (category === "Overweight") img.src = "https://via.placeholder.com/300x200?text=Overweight";
      else img.src = "https://via.placeholder.com/300x200?text=Obese";

      // Save to localStorage
      const history = JSON.parse(localStorage.getItem("bmiHistory")) || [];
      history.push({ bmi: bmi.toFixed(2), category, date: new Date().toLocaleString() });
      localStorage.setItem("bmiHistory", JSON.stringify(history));

      // Draw chart
      drawChart(history);
    }

    function drawChart(data) {
      const ctx = document.getElementById("bmiChart").getContext("2d");
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.map(d => d.date),
          datasets: [{
            label: 'BMI over Time',
            data: data.map(d => d.bmi),
            borderColor: 'blue',
            fill: false
          }]
        }
      });
    }

    function resetForm() {
      document.getElementById("bmiForm").reset();
      document.getElementById("result").innerText = "";
      document.getElementById("bmiImage").src = "";
      if (chart) chart.destroy();
      localStorage.removeItem("bmiHistory");
    }

    function downloadPDF() {
      const resultText = document.getElementById("result").innerText;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const date = new Date().toLocaleString();

      let tips = "";
      if (resultText.includes("Underweight")) {
        tips = "You are underweight. Try to include more nutritious, calorie-rich foods in your meals.";
      } else if (resultText.includes("Normal weight")) {
        tips = "Great! Maintain your weight with balanced diet and regular exercise.";
      } else if (resultText.includes("Overweight")) {
        tips = "You are overweight. Consider regular physical activity and diet control.";
      } else if (resultText.includes("Obese")) {
        tips = "You are obese. Please consult a healthcare provider for personalized advice.";
      }

      doc.setFontSize(14);
      doc.text("BMI Health Report", 10, 10);
      doc.setFontSize(12);
      doc.text(`Date: ${date}`, 10, 20);
      doc.text(`Weight: ${weight} kg`, 10, 30);
      doc.text(`Height: ${height} cm`, 10, 40);
      doc.text(resultText, 10, 50);
      doc.text("Health Tip:", 10, 65);
      doc.text(doc.splitTextToSize(tips, 180), 10, 75);

      doc.save("BMI_Health_Report.pdf");
    }
  </script>

</body>
</html>
